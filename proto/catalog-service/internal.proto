syntax = "proto3";

package catalog;

import "common/types.proto";

option go_package = "github.com/Fox216540/shop/proto/catalog-service/gen;catalog";

service InternalCatalogService {
    rpc GetProductsByIds (GetProductsByIdsRequest) returns (common.GetProductsResponse);
}

message GetProductsByIdsRequest {
    repeated string product_ids = 1;
}