syntax = "proto3";

package user.interservice;

import "common/types.proto";

option go_package = "github.com/Fox216540/shop/proto/user-service/gen/interservice;proto";

service InterserviceService {
    rpc VerifyCredentials (common.CredentialsRequest) returns (VerifyCredentialsResponse);
    //В metadata передавать userID ↓
    rpc UpdateEmail (UpdateEmailRequest) returns (UserWithMessageResponse);
    //В metadata передавать userID ↓
    rpc UpdatePassword (UpdatePasswordRequest) returns (UserWithMessageResponse);
    //В metadata передавать userID ↓
    rpc UpdatePhone (UpdatePhoneRequest) returns (UserWithMessageResponse);
    //В metadata передавать userID ↓
    rpc UpdateProfile (UpdateProfileRequest) returns (UserWithMessageResponse);
}

message UserWithMessageResponse {
    common.UserNameResponse name = 1;
    common.MessageResponse message = 2;
}

message UpdateEmailRequest {
    string email = 2;
}

message UpdatePasswordRequest {
    string password = 2;
}

message UpdatePhoneRequest {
    string phone = 2;
}

message UpdateProfileRequest {
    optional string name = 2;
    optional string address = 3;
}


message VerifyCredentialsResponse {
    string id = 1;
    string name = 2;
}