syntax = "proto3";

package user.api;

import "common/types.proto";

option go_package = "github.com/Fox216540/shop/proto/user-service/gen/api;proto";

service ApiService {
    rpc RegisterUser (RegisterUserRequest) returns (UserWithTokensResponse);
    rpc LogIn (LogInRequest) returns (UserWithTokensResponse);
}

message RegisterUserRequest {
    string email = 1;
    string name = 2;
    string password = 3;
    string address = 4;
    string phone = 5;
}

message LogInRequest {
    string phone_or_email = 1;
    string password = 2;
}


message UserWithTokensResponse {
    common.UserNameResponse name = 1;
    common.TokensResponse tokens = 2;
    common.MessageResponse message = 3;
}
