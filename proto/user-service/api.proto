syntax = "proto3";

package user.api;

import "common/types.proto";

option go_package = "github.com/Fox216540/shop/proto/user-service/gen/api;proto";

service ApiService {
    rpc RegisterUser (RegisterUserRequest) returns (common.UserWithTokensResponse);
}

message RegisterUserRequest {
    string email = 1;
    string name = 2;
    string password = 3;
    string address = 4;
    string phone = 5;
}
