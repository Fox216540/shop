syntax = "proto3";

package auth;

import "common/types.proto";

option go_package = "github.com/Fox216540/shop/proto/auth-service/gen;auth";

service InternalAuthService {
    rpc GenerateTokens (common.UserId) returns (common.TokensResponse);
    rpc DeleteAllTokens (common.UserId) returns (common.MessageResponse);
}





