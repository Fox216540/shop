syntax = "proto3";

package order.api;

import "common/types.proto";
import "google/protobuf/empty.proto";

option go_package = "github.com/Fox216540/shop/proto/order-service/gen/api;proto";

service ApiService {
    //В metadata передавать userID ↓
    rpc CreateOrder (CreateOrderRequest) returns (Order);
    //В metadata передавать userID ↓
    rpc GetOrderById (OrderId) returns (Order);
    //В metadata передавать userID ↓
    rpc GetOrdersByUserId (google.protobuf.Empty) returns (GetOrdersByUserIdResponse);
    //В metadata передавать userID ↓
    rpc DeleteOrder (OrderId) returns (DeleteOrderResponse);
}

message Item {
    common.Product product = 1;
    uint64 quantity = 2;
}

message OrderId {
    string id = 1;
}

message OrderWithItems {
    Order order = 1;
    repeated Item items = 2;
}

message ItemRequest {
    string product_id = 1;
    uint64 quantity = 2;
}

message CreateOrderRequest {
    repeated ItemRequest items = 1;
}

message Order {
    string id = 1;
    string order_num = 2;
    double total = 3;
    string status = 4;
}

message GetOrdersByUserIdResponse {
    repeated Order orders = 1;
}

message DeleteOrderResponse {
    OrderId order_id = 1;
    string status = 2;
    common.MessageResponse message = 3;
}
