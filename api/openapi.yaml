openapi: 3.0.0
info:
  title: Shop API
  description: This is a shop API
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Shop API server

paths:
  /categories:
    get:
      summary: Get all product categories
      operationId: getCategories
      tags:
        - Categories
      responses:
        '200':
          $ref: '#/components/responses/CategoriesList'
        '500':
          $ref: '#/components/responses/ServerError'

  /products:
    get:
      summary: Get products (optionally filtered by category)
      operationId: getProducts
      tags:
        - Catalog
      parameters:
        - $ref: '#/components/parameters/CategoryQuery'
      responses:
        '200':
          $ref: '#/components/responses/ProductsList'
        '500':
          $ref: '#/components/responses/ServerError'

  /products/{id}:
    get:
      summary: Get a product by its ID
      operationId: getProductById
      tags:
        - Catalog
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          $ref: '#/components/responses/Product'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /users:
    post:
      summary: Register a new user
      operationId: createUser
      tags:
        - User
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          $ref: '#/components/responses/UserCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'

  /users/me:
    delete:
      summary: Delete the authenticated user
      description: Deletes the currently authenticated user. Requires a valid Bearer token.
      operationId: deleteUser
      tags:
        - User
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          $ref: '#/components/responses/UserDeleted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /users/me/email:
    patch:
      summary: Change user email
      description: Updates the authenticated user's email. Requires Bearer token.
      tags:
        - User
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEmailRequest'
      responses:
        '200':
          $ref: '#/components/responses/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /users/me/password:
    patch:
      summary: Change user password
      description: Updates the authenticated user's password. Requires Bearer token.
      tags:
        - User
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePasswordRequest'
      responses:
        '200':
          $ref: '#/components/responses/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /users/me/phone:
    patch:
      summary: Change user phone
      description: Updates the authenticated user's phone number. Requires Bearer token.
      tags:
        - User
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePhoneRequest'
      responses:
        '200':
          $ref: '#/components/responses/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /users/me/profile:
    patch:
      summary: Change user profile
      description: Updates the authenticated user's profile fields (name and/or address). Requires Bearer token.
      tags:
        - User
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          $ref: '#/components/responses/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /auth/login:
    post:
      summary: Authenticate user
      description: Logs in a user and returns access token. Refresh token is set as HttpOnly cookie.
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          $ref: '#/components/responses/UserWithToken'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /auth/logout:
    post:
      summary: Logout from current session
      description: Deletes refresh token cookie for current session.
      tags:
        - Auth
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          $ref: '#/components/responses/MessageOK'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /auth/logout-all:
    post:
      summary: Logout from all sessions
      description: Deletes all refresh tokens for the authenticated user.
      tags:
        - Auth
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          $ref: '#/components/responses/MessageOK'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /auth/refresh:
    post:
      summary: Refresh access token
      description: Issues a new access token using the refresh token stored in HttpOnly cookie. Also updates the refresh token.
      tags:
        - Auth
      responses:
        '200':
          $ref: '#/components/responses/RefreshResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /basket:
    get:
      summary: Get basket items
      operationId: getBasket
      tags:
        - Basket
      security:
        - BearerAuth: [ ]
      responses:
        '200':
          $ref: '#/components/responses/BasketItemsList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

    post:
      summary: Add item to basket
      operationId: addItemToBasket
      tags:
        - Basket
      security:
        - BearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddBasketItemRequest'
      responses:
        '201':
          $ref: '#/components/responses/BasketItemResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

    delete:
      summary: Clear basket
      operationId: clearBasket
      tags:
        - Basket
      security:
        - BearerAuth: [ ]
      responses:
        '204':
          description: Basket cleared
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'


  /basket/{productId}:
    delete:
      summary: Remove item from basket
      operationId: removeItemFromBasket
      tags:
        - Basket
      security:
        - BearerAuth: [ ]
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/BasketItemDeleted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /orders:
    post:
      summary: Create a new order
      description: Creates a new order for the authenticated user. Requires Bearer token.
      tags:
        - Orders
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
            example:
              product_items:
                - product_id: "3f7100f5-b21b-454e-8fbc-a7f1ef5b5b7b"
                  quantity: 10
                  value: "100.00"
                  currency: "RUB"
      responses:
        '201':
          $ref: '#/components/responses/OrderCreated'
        '409':
          $ref: '#/components/responses/PriceMismatch'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

    get:
      summary: Get all orders of the authenticated user
      description: Retrieves all orders for the current user. Requires Bearer token.
      tags:
        - Orders
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          $ref: '#/components/responses/OrdersList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /orders/{id}:
    get:
      summary: Get an order by its ID
      description: Retrieves a specific order by ID. Requires Bearer token.
      tags:
        - Orders
      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          $ref: '#/components/responses/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

    delete:
      summary: Delete an order
      description: Deletes a specific order by ID. Requires Bearer token.
      tags:
        - Orders
      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          $ref: '#/components/responses/OrderDeleted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    CategoryQuery:
      name: category
      in: query
      description: Category UUID (optional — if omitted, returns all products)
      required: false
      schema:
        type: string
        format: uuid

    ProductId:
      name: id
      in: path
      required: true
      description: Product UUID
      schema:
        type: string
        format: uuid

    OrderId:
      name: id
      in: path
      required: true
      description: Order UUID
      schema:
        type: string
        format: uuid

  responses:
    PriceMismatch:
      description: Product price mismatch
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PriceMismatchError'
    Unauthorized:
      description: Unauthorized - missing or invalid token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
          example:
            message: Unauthorized

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
          example:
            message: Not found

    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
          example:
            message: Internal server error

    BadRequest:
      description: Invalid request payload
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
          examples:
            invalidPayload:
              value:
                message: Invalid missing required fields

    Conflict:
      description: Conflict - resource already exists
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
          examples:
            conflict:
              value:
                message: User already exists

    MessageOK:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
          example:
            message: Operation successful

    CategoriesList:
      description: Categories retrieved successfully
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/CategoryResponse'

    ProductsList:
      description: Products retrieved successfully
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ProductResponse'

    Product:
      description: Product retrieved successfully
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProductResponse'

    UserCreated:
      description: User created successfully
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserWithTokenResponse'

    UserDeleted:
      description: User deleted successfully
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserResponse'
          example:
            name: John Doe
            message: User deleted successfully


    UserWithToken:
      description: Login successful
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserWithTokenResponse'

    UserResponse:
      description: User operation result
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserResponse'
          example:
            name: John Doe
            message: Operation successful

    RefreshResponse:
      description: Token refreshed successfully, refresh token updated
      content:
        application/json:
          schema:
            type: object
            properties:
              access_token:
                type: string
                example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
              message:
                type: string
                example: Access and refresh tokens updated successfully
    BasketItemsList:
      description: Basket items retrieved successfully
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/BasketItem'

    BasketItemResponse:
      description: Basket item added successfully
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BasketItem'

    BasketItemDeleted:
      description: Item removed from basket
      content:
        application/json:
          example:
            message: Item removed from basket

    OrderCreated:
      description: Order created successfully
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OrderResponse'

    OrdersList:
      description: Orders retrieved successfully
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/OrderResponse'

    Order:
      description: Order retrieved successfully
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OrderWithItemsResponse'

    OrderDeleted:
      description: Order deleted successfully
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OrderDeletedResponse'
          example:
            id: "2b13fa9e-a5a7-4c71-8cc9-f11164fd2628"
            status: deleted
            message: "Order deleted successfully"

  schemas:
    Money:
      type: object
      required: [ amount, currency ]
      properties:
        amount:
          type: string
          example: "12.99"
        currency:
          type: string
          example: "EUR"

    PriceMismatchError:
      type: object
      required: [ code, product_id, expected_price, received_price ]
      properties:
        code:
          type: string
          example: PRICE_MISMATCH
        product_id:
          type: string
        expected_price:
          $ref: '#/components/schemas/Money'
        received_price:
          $ref: '#/components/schemas/Money'

    # Reusable simple message
    MessageResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: Error message description

    # Categories
    CategoryResponse:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
          example: 4b8f5db4-ac77-4738-ad9e-9da30f215b2e
        name:
          type: string
          example: Electronics

    # Orders: requests
    CreateOrderRequest:
      type: object
      required: [ items ]
      properties:
        items:
          type: array
          items:
            type: object
            required: [ product_id, price, quantity ]
            properties:
              product_id:
                type: string
                format: uuid
              price:
                $ref: '#/components/schemas/Money'
              quantity:
                type: integer
                format: uint64
                minimum: 1

    # Orders and products: shared building blocks
    ProductShort:
      type: object
      required:
        - id
        - name
        - img
        - price
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        img:
          type: string
          format: uri
        price:
          $ref: '#/components/schemas/Money'

    ProductResponse:
      allOf:
        - $ref: '#/components/schemas/ProductShort'
        - type: object
          required:
            - category_id
            - description
            - stock
          properties:
            category_id:
              type: string
              format: uuid
              example: 4b8f5db4-ac77-4738-ad9e-9da30f215b2e
            description:
              type: string
              example: A modern smartphone with an excellent camera and display.
            stock:
              type: integer
              format: uint64
              minimum: 0
              example: 42
    BasketItem:
      type: object
      required: [ product, quantity ]
      properties:
        product:
          $ref: "#/components/schemas/ProductShort"
        quantity:
          type: integer

    AddBasketItemRequest:
      type: object
      properties:
        productId:
          type: string
        quantity:
          type: integer
          minimum: 1
      required:
        - productId
        - quantity

    OrderResponse:
      type: object
      required:
        - id
        - order_number
        - total
        - status
        - currency
      properties:
        id:
          type: string
          format: uuid
        order_number:
          type: string
          example: ORD-123456789
        price:
          $ref: '#/components/schemas/Money'
        status:
          type: string
          example: pending

    OrderItem:
      type: object
      required:
        - quantity
        - product
      properties:
        product:
          $ref: '#/components/schemas/ProductShort'
        quantity:
          type: integer
          format: uint64
          minimum: 1

    OrderWithItemsResponse:
      allOf:
        - $ref: '#/components/schemas/OrderResponse'
        - type: object
          required:
            - order_items
          properties:
            order_items:
              type: array
              items:
                $ref: '#/components/schemas/OrderItem'

    OrderDeletedResponse:
      type: object
      required:
        - id
        - status
        - message
      properties:
        id:
          type: string
          format: uuid
          example: 2b13fa9e-a5a7-4c71-8cc9-f11164fd2628
        status:
          type: string
          example: deleted
        message:
          type: string
          example: Order deleted successfully

    # User-related schemas
    RegisterRequest:
      type: object
      required:
        - email
        - name
        - password
        - address
        - phone
      properties:
        email:
          type: string
          format: email
          example: john.doe@example.com
        name:
          type: string
          example: John Doe
        password:
          type: string
          format: password
          example: MySecurePass123
        address:
          type: string
          example: 123 Main St, Springfield, USA
        phone:
          type: string
          example: "+1-555-123-4567"

    UserResponse:
      type: object
      required:
        - name
        - message
      properties:
        name:
          type: string
        message:
          type: string

    UserWithTokenResponse:
      type: object
      required:
        - name
        - access_token
        - message
      properties:
        name:
          type: string
          example: John Doe
        access_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        message:
          type: string
          example: Success

    # Login
    LoginRequest:
      type: object
      required:
        - phone_or_email
        - password
      properties:
        phone_or_email:
          type: string
          example: john.doe@example.com
        password:
          type: string
          format: password
          example: MySecurePass123

    # Update small fields requests (kept separate for clear validation and examples)
    UpdateEmailRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: new.email@example.com

    UpdatePasswordRequest:
      type: object
      required:
        - password
      properties:
        password:
          type: string
          format: password
          example: NewSecurePass123

    UpdatePhoneRequest:
      type: object
      required:
        - phone
      properties:
        phone:
          type: string
          example: "+1-555-123-4567"

    UpdateProfileRequest:
      type: object
      properties:
        name:
          type: string
          example: Andrei
        address:
          type: string
          example: 123 Main St, Springfield

