openapi: 3.0.0
info:
  title: Shop API
  description: This is a shop API
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Shop API server
paths:
  /categories:
    get:
      summary: Get all product categories
      operationId: getCategories
      tags:
        - Categories
      responses:
        '200':
          description: Categories retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryResponse'

  /catalog:
    get:
      summary: Get products (optionally filtered by category)
      operationId: getProducts
      tags:
        - Catalog
      parameters:
        - name: category
          in: query
          description: Category UUID (optional — if omitted, returns all products)
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Products retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductResponse'

  /catalog/{id}:
    get:
      summary: Get a product by its ID
      operationId: getProductById
      tags:
        - Catalog
      parameters:
        - name: id
          in: path
          required: true
          description: Product UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Product retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '404':
          description: Product not found
  /user:
    post:
      summary: Register a new user
      operationId: createUser
      tags:
        - User
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserWithTokenResponse'
        '400':
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              examples:
                invalidPayload:
                  value:
                    message: Invalid email or missing required fields
        '409':
          description: User already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              examples:
                conflict:
                  value:
                    message: User already exists
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              examples:
                serverError:
                  value:
                    message: Internal server error
    delete:
      summary: Delete the authenticated user
      description: Deletes the currently authenticated user. Requires a valid Bearer token.
      operationId: deleteUser
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: User deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
              example:
                id: 9e6c2d64-3f17-4a5b-88c5-6efbd0e41b77
                name: John Doe
                message: User deleted successfully
        '401':
          description: Unauthorized - missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Unauthorized
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: User not found
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Internal server error
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    CategoryResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 4b8f5db4-ac77-4738-ad9e-9da30f215b2e
        name:
          type: string
          example: Electronics

    ProductResponse:
      type: object
      properties:
        id:
          type: string
          example: 23509e16-004c-41ee-8fe2-f93554064eef
        name:
          type: string
          example: Samsung Galaxy S23 Smartphone
        img:
          type: string
          format: uri
          example: https://example.com/images/s23.jpg
        price:
          type: number
          format: float
          example: 799.99
        category_id:
          type: string
          format: uuid
          example: 4b8f5db4-ac77-4738-ad9e-9da30f215b2e
        description:
          type: string
          example: A modern smartphone with an excellent camera and display.
        stock:
          type: integer
          example: 42
    RegisterRequest:
      type: object
      required:
        - email
        - name
        - password
        - address
        - phone
      properties:
        email:
          type: string
          format: email
          example: john.doe@example.com
        name:
          type: string
          example: John Doe
        password:
          type: string
          format: password
          example: MySecurePass123
        address:
          type: string
          example: 123 Main St, Springfield, USA
        phone:
          type: string
          example: "+1-555-123-4567"

    UserWithTokenResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 9e6c2d64-3f17-4a5b-88c5-6efbd0e41b77
        name:
          type: string
          example: John Doe
        access_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        message:
          type: string
          example: User created successfully
    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 9e6c2d64-3f17-4a5b-88c5-6efbd0e41b77
        name:
          type: string
          example: John Doe
        message:
          type: string
          example: User deleted successfully
    MessageResponse:
      type: object
      properties:
        message:
          type: string
          example: Error message description