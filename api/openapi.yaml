openapi: 3.0.0
info:
  title: Shop API
  description: This is a shop API
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Shop API server

paths:
  /categories:
    get:
      summary: Get all product categories
      operationId: getCategories
      tags:
        - Categories
      responses:
        '200':
          description: Categories retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryResponse'

  /products:
    get:
      summary: Get products (optionally filtered by category)
      operationId: getProducts
      tags:
        - Catalog
      parameters:
        - name: category
          in: query
          description: Category UUID (optional — if omitted, returns all products)
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Products retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductResponse'

  /products/{id}:
    get:
      summary: Get a product by its ID
      operationId: getProductById
      tags:
        - Catalog
      parameters:
        - name: id
          in: path
          required: true
          description: Product UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Product retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '404':
          description: Product not found

  /users:
    post:
      summary: Register a new user
      operationId: createUser
      tags:
        - User
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserWithTokenResponse'
        '400':
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              examples:
                invalidPayload:
                  value:
                    message: Invalid email or missing required fields
        '409':
          description: User already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              examples:
                conflict:
                  value:
                    message: User already exists
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              examples:
                serverError:
                  value:
                    message: Internal server error

  /users/me:
    delete:
      summary: Delete the authenticated user
      description: Deletes the currently authenticated user. Requires a valid Bearer token.
      operationId: deleteUser
      tags:
        - User
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: User deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
              example:
                name: John Doe
                message: User deleted successfully
        '401':
          description: Unauthorized - missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Unauthorized
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: User not found
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Internal server error

  /users/me/email:
    patch:
      summary: Change user email
      description: Updates the authenticated user's email. Requires Bearer token.
      tags:
        - User
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  example: new.email@example.com
      responses:
        '200':
          description: Email updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
              example:
                name: John Doe
                message: Email updated successfully
        '400':
          description: Invalid email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /users/me/password:
    patch:
      summary: Change user password
      description: Updates the authenticated user's password. Requires Bearer token.
      tags:
        - User
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - password
              properties:
                password:
                  type: string
                  format: password
                  example: NewSecurePass123
      responses:
        '200':
          description: Password updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
              example:
                name: John Doe
                message: Password updated successfully
        '400':
          description: Invalid password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /users/me/phone:
    patch:
      summary: Change user phone
      description: Updates the authenticated user's phone number. Requires Bearer token.
      tags:
        - User
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone
              properties:
                phone:
                  type: string
                  example: "+1-555-123-4567"
      responses:
        '200':
          description: Phone updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
              example:
                name: John Doe
                message: Phone updated successfully
        '400':
          description: Invalid phone
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /users/me/profile:
    patch:
      summary: Change user profile
      description: Updates the authenticated user's profile fields (name and/or address). Requires Bearer token.
      tags:
        - User
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Andrei
                address:
                  type: string
                  example: 123 Main St, Springfield
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
              example:
                name: John Doe
                message: Profile updated successfully
        '400':
          description: Invalid data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /auth/login:
    post:
      summary: Authenticate user
      description: Logs in a user and returns access token. Refresh token is set as HttpOnly cookie.
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone_or_email
                - password
              properties:
                phone_or_email:
                  type: string
                  example: john.doe@example.com
                password:
                  type: string
                  format: password
                  example: MySecurePass123
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserWithTokenResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Invalid credentials
  /auth/logout:
    post:
      summary: Logout from current session
      description: Deletes refresh token cookie for current session.
      tags:
        - Auth
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Logged out successfully
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /auth/logout-all:
    post:
      summary: Logout from all sessions
      description: Deletes all refresh tokens for the authenticated user.
      tags:
        - Auth
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Logout from all sessions successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Logged out from all devices successfully
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /auth/refresh:
    post:
      summary: Refresh access token
      description: Issues a new access token using the refresh token stored in HttpOnly cookie. Also updates the refresh token.
      tags:
        - Auth
      responses:
        '200':
          description: Token refreshed successfully, refresh token updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  message:
                    type: string
                    example: Access and refresh tokens updated successfully
        '401':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /orders:
    post:
      summary: Create a new order
      description: Creates a new order for the authenticated user. Requires Bearer token.
      tags:
        - Orders
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
            example:
              product_items:
                - product_id: "3f7100f5-b21b-454e-8fbc-a7f1ef5b5b7b"
                  quantity: 10
      responses:
        '201':
          description: Order created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: Invalid order data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
    get:
      summary: Get all orders of the authenticated user
      description: Retrieves all orders for the current user. Requires Bearer token.
      tags:
        - Orders
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Orders retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /orders/{id}:
    get:
      summary: Get an order by its ID
      description: Retrieves a specific order by ID. Requires Bearer token.
      tags:
        - Orders
      security:
        - bearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          description: Order UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Order retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
    delete:
      summary: Delete an order
      description: Deletes a specific order by ID. Requires Bearer token.
      tags:
        - Orders
      security:
        - bearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          description: Order UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Order deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDeletedResponse'
              example:
                id: "2b13fa9e-a5a7-4c71-8cc9-f11164fd2628"
                status: deleted
                message: "Order deleted successfully"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    CategoryResponse:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
          example: 4b8f5db4-ac77-4738-ad9e-9da30f215b2e
        name:
          type: string
          example: Electronics

    CreateOrderRequest:
      type: object
      required:
        - product_items
      properties:
        product_items:
          type: array
          items:
            type: object
            required:
              - product_id
              - quantity
            properties:
              product_id:
                type: string
                format: uuid
              quantity:
                type: integer
                minimum: 1

    MessageResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: Error message description

    OrderResponse:
      type: object
      required:
        - id
        - order_number
        - order_items
      properties:
        id:
          type: string
          format: uuid
        order_number:
          type: string
          example: ORD-123456789
        order_items:
          type: array
          items:
            type: object
            properties:
              product:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    name:
                      type: string
                    img:
                      type: string
                      format: uri
                    price:
                      type: number
                      format: float
              quantity:
                type: integer
        total:
          type: number
          format: float
          example: 1599.98
        status:
          type: string
          example: pending

    OrderDeletedResponse:
      type: object
      required:
        - id
        - status
        - message
      properties:
        id:
          type: string
          format: uuid
          example: 2b13fa9e-a5a7-4c71-8cc9-f11164fd2628
        status:
          type: string
          example: deleted
        message:
          type: string
          example: Order deleted successfully

    ProductResponse:
      type: object
      required:
        - id
        - name
        - img
        - price
        - category_id
        - description
        - stock
      properties:
        id:
          type: string
          format: uuid
          example: 23509e16-004c-41ee-8fe2-f93554064eef
        name:
          type: string
          example: Samsung Galaxy S23 Smartphone
        img:
          type: string
          format: uri
          example: https://example.com/images/s23.jpg
        price:
          type: number
          format: double
          example: 799.99
        category_id:
          type: string
          format: uuid
          example: 4b8f5db4-ac77-4738-ad9e-9da30f215b2e
        description:
          type: string
          example: A modern smartphone with an excellent camera and display.
        stock:
          type: integer
          format: uint64
          minimum: 0
          example: 42

    RegisterRequest:
      type: object
      required:
        - email
        - name
        - password
        - address
        - phone
      properties:
        email:
          type: string
          format: email
          example: john.doe@example.com
        name:
          type: string
          example: John Doe
        password:
          type: string
          format: password
          example: MySecurePass123
        address:
          type: string
          example: 123 Main St, Springfield, USA
        phone:
          type: string
          example: "+1-555-123-4567"

    UserResponse:
      type: object
      required:
        - name
        - message
      properties:
        name:
          type: string
        message:
          type: string

    UserWithTokenResponse:
      type: object
      required:
        - name
        - access_token
        - message
      properties:
        name:
          type: string
          example: John Doe
        access_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        message:
          type: string
          example: Success
