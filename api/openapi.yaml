openapi: 3.0.3
info:
  title: Shop API
  description: Public HTTP API for the shop services.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Shop API server
tags:
  - name: Auth
  - name: Basket
  - name: Catalog
  - name: Categories
  - name: Orders
  - name: User

paths:
  /categories:
    get:
      summary: Get all product categories
      operationId: getCategories
      tags:
        - Categories
      responses:
        '200':
          $ref: '#/components/responses/CategoriesList'
        '500':
          $ref: '#/components/responses/ServerError'

  /products:
    get:
      summary: Get products (optionally filtered by category)
      operationId: getProducts
      tags:
        - Catalog
      parameters:
        - $ref: '#/components/parameters/CategoryId'
        - $ref: '#/components/parameters/Currency'
      responses:
        '200':
          $ref: '#/components/responses/ProductsList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

  /products/{product_id}:
    get:
      summary: Get a product by its ID
      operationId: getProductById
      tags:
        - Catalog
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/Currency'
      responses:
        '200':
          $ref: '#/components/responses/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /users:
    post:
      summary: Register a new user
      operationId: createUser
      tags:
        - User
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          $ref: '#/components/responses/UserCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'

  /users/me:
    delete:
      summary: Delete the authenticated user
      description: Deletes the currently authenticated user. Requires a valid Bearer token.
      operationId: deleteUser
      tags:
        - User
      security:
        - bearerAuth: [ ]
      responses:
        '204':
          description: User deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /users/me/email:
    patch:
      summary: Change user email
      description: Updates the authenticated user's email. Requires Bearer token.
      operationId: updateUserEmail
      tags:
        - User
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEmailRequest'
      responses:
        '200':
          $ref: '#/components/responses/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /users/me/password:
    patch:
      summary: Change user password
      description: Updates the authenticated user's password. Requires Bearer token.
      operationId: updateUserPassword
      tags:
        - User
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePasswordRequest'
      responses:
        '200':
          $ref: '#/components/responses/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /users/me/phone:
    patch:
      summary: Change user phone
      description: Updates the authenticated user's phone number. Requires Bearer token.
      operationId: updateUserPhone
      tags:
        - User
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePhoneRequest'
      responses:
        '200':
          $ref: '#/components/responses/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /users/me/profile:
    patch:
      summary: Change user profile
      description: Updates the authenticated user's profile fields (name and/or address). Requires Bearer token.
      operationId: updateUserProfile
      tags:
        - User
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          $ref: '#/components/responses/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /auth/login:
    post:
      summary: Authenticate user
      description: Logs in a user and returns access token. Refresh token is set as HttpOnly cookie.
      operationId: login
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          $ref: '#/components/responses/UserWithToken'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /auth/logout:
    post:
      summary: Logout from current session
      description: Deletes refresh token cookie for current session.
      operationId: logout
      tags:
        - Auth
      security:
        - refreshCookie: [ ]
      responses:
        '200':
          $ref: '#/components/responses/AuthMessageOK'
        '401':
          $ref: '#/components/responses/CookieUnauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /auth/logout-all:
    post:
      summary: Logout from all sessions
      description: Deletes all refresh tokens for the authenticated user.
      operationId: logoutAll
      tags:
        - Auth
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          $ref: '#/components/responses/AuthMessageOK'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /auth/refresh:
    post:
      summary: Refresh access token
      description: Issues a new access token using the refresh token stored in HttpOnly cookie. Also updates the refresh token.
      operationId: refreshToken
      tags:
        - Auth
      security:
        - refreshCookie: [ ]
      responses:
        '200':
          $ref: '#/components/responses/RefreshResponse'
        '401':
          $ref: '#/components/responses/CookieUnauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /basket:
    get:
      summary: Get basket items
      operationId: getBasket
      tags:
        - Basket
      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/Currency'
      responses:
        '200':
          $ref: '#/components/responses/BasketResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

    post:
      summary: Add item to basket
      operationId: addItemToBasket
      tags:
        - Basket
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddBasketItemRequest'
      responses:
        '201':
          $ref: '#/components/responses/BasketItemResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

    delete:
      summary: Clear basket
      operationId: clearBasket
      tags:
        - Basket
      security:
        - bearerAuth: [ ]
      responses:
        '204':
          description: Basket cleared successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'


  /basket/{product_id}:
    delete:
      summary: Remove item from basket
      operationId: removeItemFromBasket
      tags:
        - Basket
      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        '200':
          $ref: '#/components/responses/MessageOK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /orders:
    post:
      summary: Create a new order
      description: Creates a new order for the authenticated user. Requires Bearer token.
      operationId: createOrder
      tags:
        - Orders
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          $ref: '#/components/responses/OrderCreated'
        '409':
          $ref: '#/components/responses/PriceMismatch'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

    get:
      summary: Get all orders of the authenticated user
      description: Retrieves all orders for the current user. Requires Bearer token.
      operationId: getOrders
      tags:
        - Orders
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          $ref: '#/components/responses/OrdersList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /orders/{order_id}:
    get:
      summary: Get an order by its ID
      description: Retrieves a specific order by ID. Requires Bearer token.
      operationId: getOrderById
      tags:
        - Orders
      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          $ref: '#/components/responses/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

    delete:
      summary: Delete an order
      description: Deletes a specific order by ID. Requires Bearer token.
      operationId: deleteOrder
      tags:
        - Orders
      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          $ref: '#/components/responses/OrderDeleted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: __Host-refresh

  parameters:
    CategoryId:
      name: category_id
      in: query
      description: Category UUID (optional — if omitted, returns all products)
      required: false
      schema:
        type: string
        format: uuid

    ProductId:
      name: product_id
      in: path
      required: true
      description: Product UUID
      schema:
        type: string
        format: uuid

    OrderId:
      name: order_id
      in: path
      required: true
      description: Order UUID
      schema:
        type: string
        format: uuid

    Currency:
      name: currency
      in: query
      required: true
      description: Currency of user
      schema:
        type: string
        minLength: 3
        maxLength: 3
        example: EUR

  responses:
    PriceMismatch:
      description: Product price mismatch
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PriceMismatchError'
    Unauthorized:
      description: Unauthorized - missing or invalid token
      headers:
        WWW-Authenticate:
          description: Authentication challenge for bearer-protected resources
          schema:
            type: string
            example: Bearer realm="shop-api"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
          example:
            message: Unauthorized

    CookieUnauthorized:
      description: Unauthorized - missing or invalid refresh cookie
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
          example:
            message: Unauthorized

    AuthUnauthorized:
      description: Unauthorized - invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
          example:
            message: Unauthorized

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
          example:
            message: Not found

    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
          example:
            message: Internal server error

    BadRequest:
      description: Invalid request payload
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
          examples:
            invalidPayload:
              value:
                message: Invalid missing required fields

    Conflict:
      description: Conflict - resource already exists
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
          examples:
            conflict:
              value:
                message: User already exists

    MessageOK:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
          example:
            message: Operation successful

    AuthMessageOK:
      description: OK
      headers:
        Set-Cookie:
          description: Clears the refresh token cookie when applicable
          schema:
            type: string
            example: __Host-refresh=; HttpOnly; Secure; SameSite=Strict; Path=/; Max-Age=0
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
          example:
            message: Operation successful

    CategoriesList:
      description: Categories retrieved successfully
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/CategoryResponse'

    ProductsList:
      description: Products retrieved successfully
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ProductResponse'

    Product:
      description: Product retrieved successfully
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProductResponse'

    UserCreated:
      description: User created successfully
      headers:
        Set-Cookie:
          description: HttpOnly refresh token cookie
          schema:
            type: string
            example: __Host-refresh=refresh-token; HttpOnly; Secure; SameSite=Strict; Path=/
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserWithTokenResponse'

    UserWithToken:
      description: Login successful
      headers:
        Set-Cookie:
          description: HttpOnly refresh token cookie
          schema:
            type: string
            example: __Host-refresh=refresh-token; HttpOnly; Secure; SameSite=Strict; Path=/
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserWithTokenResponse'

    UserResponse:
      description: User operation result
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserResponse'
          example:
            name: John Doe
            message: Operation successful

    RefreshResponse:
      description: Token refreshed successfully, refresh token updated
      headers:
        Set-Cookie:
          description: Updated HttpOnly refresh token cookie
          schema:
            type: string
            example: __Host-refresh=refresh-token; HttpOnly; Secure; SameSite=Strict; Path=/
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RefreshResponse'

    BasketResponse:
      description: Basket items retrieved successfully
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BasketResponse'

    BasketItemResponse:
      description: Basket item added successfully
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BasketItem'

    OrderCreated:
      description: Order created successfully
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OrderResponse'

    OrdersList:
      description: Orders retrieved successfully
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/OrderResponse'

    Order:
      description: Order retrieved successfully
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OrderWithItemsResponse'

    OrderDeleted:
      description: Order deleted successfully
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OrderDeletedResponse'
          example:
            id: "2b13fa9e-a5a7-4c71-8cc9-f11164fd2628"
            status: deleted
            message: "Order deleted successfully"

  schemas:
    Money:
      type: object
      required: [ amount, currency ]
      properties:
        amount:
          type: string
          pattern: '^\d+(\.\d{1,2})?$'
          example: "12.99"
        currency:
          type: string
          minLength: 3
          maxLength: 3
          example: "EUR"

    PriceMismatchError:
      type: object
      required: [ code, error_items ]
      properties:
        code:
          type: string
          enum:
            - PRICE_MISMATCH
          example: PRICE_MISMATCH
        error_items:
          type: array
          items:
            type: object
            required:
              - product_id
              - expected_price
              - actual_price
            properties:
              product_id:
                type: string
                format: uuid
              expected_price:
                $ref: '#/components/schemas/Money'
              actual_price:
                $ref: '#/components/schemas/Money'

    # Reusable simple message
    MessageResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          minLength: 1
          example: Error message description

    # Categories
    CategoryResponse:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
          example: 4b8f5db4-ac77-4738-ad9e-9da30f215b2e
        name:
          type: string
          minLength: 1
          example: Electronics

    # Orders: requests
    CreateOrderRequest:
      type: object
      required: [ items ]
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [ product_id, expected_price, quantity ]
            properties:
              product_id:
                type: string
                format: uuid
              expected_price:
                $ref: '#/components/schemas/Money'
              quantity:
                type: integer
                format: int64
                minimum: 1

    # Orders and products: shared building blocks
    ProductShort:
      type: object
      required:
        - id
        - name
        - img
        - price
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
        img:
          type: string
          format: uri
        price:
          $ref: '#/components/schemas/Money'

    ProductResponse:
      allOf:
        - $ref: '#/components/schemas/ProductShort'
        - type: object
          required:
            - category_id
            - description
            - stock
          properties:
            category_id:
              type: string
              format: uuid
              example: 4b8f5db4-ac77-4738-ad9e-9da30f215b2e
            description:
              type: string
              example: A modern smartphone with an excellent camera and display.
            stock:
              type: integer
              format: int64
              minimum: 0
              example: 42

    BasketResponse:
      type: object
      required:
        - items
        - total
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/BasketItem"
        total:
          $ref: "#/components/schemas/Money"

    BasketItem:
      type: object
      required: [ product, quantity ]
      properties:
        product:
          $ref: "#/components/schemas/ProductShort"
        quantity:
          type: integer
          format: int64
          minimum: 1

    AddBasketItemRequest:
      type: object
      properties:
        product_id:
          type: string
          format: uuid
        quantity:
          type: integer
          format: int64
          minimum: 1
      required:
        - product_id
        - quantity

    OrderResponse:
      type: object
      required:
        - id
        - order_number
        - total
        - status
      properties:
        id:
          type: string
          format: uuid
        order_number:
          type: string
          minLength: 1
          example: ORD-123456789
        total:
          $ref: '#/components/schemas/Money'
        status:
          type: string
          enum:
            - pending
            - paid
            - cancelled
            - deleted
          example: pending

    OrderItem:
      type: object
      required:
        - quantity
        - product
      properties:
        product:
          $ref: '#/components/schemas/ProductShort'
        quantity:
          type: integer
          format: int64
          minimum: 1

    OrderWithItemsResponse:
      allOf:
        - $ref: '#/components/schemas/OrderResponse'
        - type: object
          required:
            - order_items
          properties:
            order_items:
              type: array
              items:
                $ref: '#/components/schemas/OrderItem'

    OrderDeletedResponse:
      type: object
      required:
        - id
        - status
        - message
      properties:
        id:
          type: string
          format: uuid
          example: 2b13fa9e-a5a7-4c71-8cc9-f11164fd2628
        status:
          type: string
          enum:
            - deleted
          example: deleted
        message:
          type: string
          minLength: 1
          example: Order deleted successfully

    # User-related schemas
    RegisterRequest:
      type: object
      required:
        - email
        - name
        - password
        - address
        - phone
      properties:
        email:
          type: string
          format: email
          example: john.doe@example.com
        name:
          type: string
          minLength: 1
          example: John Doe
        password:
          type: string
          format: password
          minLength: 8
          example: MySecurePass123
        address:
          type: string
          minLength: 1
          example: 123 Main St, Springfield, USA
        phone:
          type: string
          minLength: 1
          example: "+1-555-123-4567"

    UserResponse:
      type: object
      required:
        - name
        - message
      properties:
        name:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1

    UserWithTokenResponse:
      type: object
      required:
        - name
        - access_token
        - message
      properties:
        name:
          type: string
          minLength: 1
          example: John Doe
        access_token:
          type: string
          minLength: 1
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        message:
          type: string
          minLength: 1
          example: Success

    RefreshResponse:
      type: object
      required:
        - access_token
        - message
      properties:
        access_token:
          type: string
          minLength: 1
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        message:
          type: string
          minLength: 1
          example: Access and refresh tokens updated successfully

    # Login
    LoginRequest:
      type: object
      required:
        - phone_or_email
        - password
      properties:
        phone_or_email:
          type: string
          minLength: 1
          example: john.doe@example.com
        password:
          type: string
          format: password
          minLength: 1
          example: MySecurePass123

    # Update small fields requests (kept separate for clear validation and examples)
    UpdateEmailRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: new.email@example.com

    UpdatePasswordRequest:
      type: object
      required:
        - password
      properties:
        password:
